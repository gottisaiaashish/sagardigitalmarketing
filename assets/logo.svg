<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="100%" height="100%" fill="none">
  <!-- Monogram Mark -->
  <g transform="translate(10, 8)">
    <!-- Base dark polygon -->
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#102B18" stroke="#163920" stroke-width="1.5" />
    
    <!-- Geometric Growth "S" path with Lime accent -->
    <path d="M 14 16 C 14 13.5 17 12 22 12 C 28 12 30 14.5 30 17.5 C 30 22 23 23 20 24.5 C 16 26.5 14 28.5 14 32 C 14 36.5 18 39 23 39 C 29 39 31 36.5 31 34" 
          stroke="#8BE13D" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Dynamic Growth Dot -->
    <circle cx="31" cy="14" r="3" fill="#8BE13D" />
  </g>

  <!-- Typographic Wordmark -->
  <!-- Primary Brand Name -->
  <text x="68" y="32" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="21" fill="#FFFFFF" letter-spacing="-0.02em">SAGAR</text>
  
  <!-- Sub-label Digital Marketing -->
  <text x="68" y="47" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="8.5" fill="#8BE13D" letter-spacing="0.22em">DIGITAL MARKETING</text>
</svg>

